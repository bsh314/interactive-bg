name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Opens or updates the "Version Packages" PR while changesets are pending.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Once that PR is merged, stage the new version on npm. It goes public only after a maintainer
      # approves it on npmjs.com with 2FA. The git tag marks a version as staged, so later pushes
      # don't try to stage it again.
      - name: Check for a new version
        id: version
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --quiet --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged; nothing to stage."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # Staging needs npm 11.15+; Node 22 ships with npm 10. No npm token: npm authenticates with the
      # workflow's OIDC identity, registered as a trusted publisher on npmjs.com.
      - name: Stage on npm
        if: steps.version.outputs.new == 'true'
        run: |
          npm install -g npm@latest
          npm run release
      - name: Tag and create the GitHub release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "See [CHANGELOG.md](CHANGELOG.md)."
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
