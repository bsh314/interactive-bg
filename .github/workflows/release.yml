name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Opens a "Version Packages" PR while changesets are pending;
      # once that PR is merged, publishes the new version to npm.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # `changeset publish` tags each published version on the runner, but the action doesn't
      # always recognise the newer CLI's output and then skips pushing them. Push any new tags here
      # (a no-op when nothing was published) and create the matching GitHub release.
      - name: Push release tags
        run: |
          git push origin --tags
          for tag in $(git tag --points-at HEAD); do
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "See [CHANGELOG.md](CHANGELOG.md)."
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
